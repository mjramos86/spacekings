<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05060f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Space Kings — Endless Runner RPG</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
</head>
<body>
  <!-- Animated star background shared by all screens -->
  <div id="bg-stars" class="bg-stars" aria-hidden="true">
    <div class="star-layer layer1"></div>
    <div class="star-layer layer2"></div>
    <div class="star-layer layer3"></div>
    <div class="nebula"></div>
  </div>

  <div id="app" class="app">

    <!-- ====================== LOGIN ====================== -->
    <section id="screen-login" class="screen active">
      <div class="login-wrap">
        <div class="logo">
          <div class="logo-glyph">👑</div>
          <h1 class="logo-title">SPACE<span>KINGS</span></h1>
          <p class="logo-sub">Endless Runner • Auto-Combat RPG</p>
        </div>
        <div class="panel login-panel">
          <label class="field">
            <span>First name</span>
            <input id="login-first" type="text" autocomplete="off" maxlength="16" placeholder="e.g. Nova" />
          </label>
          <label class="field">
            <span>Last name</span>
            <input id="login-last" type="text" autocomplete="off" maxlength="16" placeholder="e.g. Vega" />
          </label>
          <button id="login-btn" class="btn btn-primary btn-block">Launch Captain</button>
          <p class="hint">Your progress is saved on this device, linked to your captain name.</p>
        </div>
        <div id="login-roster" class="roster"></div>
      </div>
    </section>

    <!-- ==================== APPEARANCE ==================== -->
    <section id="screen-appearance" class="screen">
      <div class="screen-head">
        <h2>Create Your Captain</h2>
      </div>
      <div class="appearance-wrap">
        <div class="avatar-stage">
          <div id="appearance-avatar" class="avatar-big"></div>
          <div id="appearance-name" class="avatar-name"></div>
        </div>
        <div class="panel appearance-controls">
          <div class="picker" data-group="sex">
            <span class="picker-label">Sex</span>
            <div class="picker-options" id="pick-sex"></div>
          </div>
          <div class="picker" data-group="skin">
            <span class="picker-label">Skin</span>
            <div class="picker-options swatches" id="pick-skin"></div>
          </div>
          <div class="picker" data-group="eyes">
            <span class="picker-label">Eyes</span>
            <div class="picker-options swatches" id="pick-eyes"></div>
          </div>
          <div class="picker" data-group="hair">
            <span class="picker-label">Hair</span>
            <div class="picker-options swatches" id="pick-hair"></div>
          </div>
          <button id="appearance-confirm" class="btn btn-primary btn-block">Confirm Captain</button>
        </div>
      </div>
    </section>

    <!-- ======================= HUB ======================= -->
    <section id="screen-hub" class="screen">
      <header class="topbar">
        <div id="hub-avatar" class="topbar-avatar"></div>
        <div class="topbar-info">
          <div class="topbar-name" id="hub-name">Captain</div>
          <div class="xpbar"><div class="xpbar-fill" id="hub-xpfill"></div><span class="xpbar-text" id="hub-xptext"></span></div>
        </div>
        <div class="topbar-right">
          <div class="credits" id="hub-credits">💰 0</div>
          <button id="hub-logout" class="btn btn-ghost btn-sm" title="Switch captain">⏻</button>
        </div>
      </header>

      <div class="hub-body">
        <h3 class="section-title">Missions</h3>
        <div class="hub-grid missions">
          <button class="hub-card mission planet" data-action="mission-planet">
            <div class="hub-card-icon">🪐</div>
            <div class="hub-card-title">Planet Exploration</div>
            <div class="hub-card-sub">Run the surface • fight • loot</div>
          </button>
          <button class="hub-card mission ship" data-action="mission-ship">
            <div class="hub-card-icon">🛸</div>
            <div class="hub-card-title">Ship Battle</div>
            <div class="hub-card-sub">Duel pirates • destroy or board</div>
          </button>
        </div>

        <h3 class="section-title">Station</h3>
        <div class="hub-grid station">
          <button class="hub-card" data-action="character"><div class="hub-card-icon">🧑‍🚀</div><div class="hub-card-title">Captain</div></button>
          <button class="hub-card" data-action="ship"><div class="hub-card-icon">🚀</div><div class="hub-card-title">Ship Bay</div></button>
          <button class="hub-card" data-action="robots"><div class="hub-card-icon">🤖</div><div class="hub-card-title">Robotics</div></button>
          <button class="hub-card" data-action="shop"><div class="hub-card-icon">🛒</div><div class="hub-card-title">Shop</div></button>
        </div>
      </div>
    </section>

    <!-- ================= GENERIC PANEL SCREEN ================= -->
    <section id="screen-panel" class="screen">
      <header class="screen-head sub">
        <button class="btn btn-ghost btn-sm back-btn" data-back>‹ Station</button>
        <h2 id="panel-title">Panel</h2>
        <div class="head-spacer"></div>
      </header>
      <div id="panel-content" class="panel-content"></div>
    </section>

    <!-- ================= MISSION SELECT ================= -->
    <section id="screen-select" class="screen">
      <header class="screen-head sub">
        <button class="btn btn-ghost btn-sm back-btn" data-back-hub>‹ Hub</button>
        <h2 id="select-title">Choose a Target</h2>
        <div class="head-spacer"></div>
      </header>
      <div id="select-content" class="select-content"></div>
    </section>

    <!-- ================= RUN / COMBAT ================= -->
    <section id="screen-run" class="screen run-screen">
      <div id="run-scene" class="run-scene">
        <div class="run-floor"></div>
        <div class="run-ceiling"></div>
        <div id="run-progress" class="run-progress"></div>

        <!-- running transition overlay -->
        <div id="run-travel" class="run-travel">
          <div class="travel-text">RUNNING…</div>
        </div>

        <!-- combat view injected here -->
        <div id="combat-view" class="combat-view"></div>
      </div>
      <div id="run-foot" class="run-foot"></div>
    </section>

  </div>

  <!-- ================= LOOT CARD OVERLAY ================= -->
  <div id="card-overlay" class="card-overlay">
    <div class="card-zones">
      <div class="card-zone left"><span>⬅ SELL</span></div>
      <div class="card-zone right"><span>EQUIP ➡</span></div>
    </div>
    <div id="loot-card" class="loot-card">
      <div class="loot-rarity-bar"></div>
      <div class="loot-head">
        <div class="loot-icon"></div>
        <div class="loot-name"></div>
        <div class="loot-rarity"></div>
      </div>
      <div class="loot-stats"></div>
      <div class="loot-foot">
        <div class="loot-slot"></div>
        <div class="loot-value"></div>
      </div>
    </div>
    <div class="card-actions">
      <button id="card-sell" class="btn btn-sell">Sell 💰</button>
      <button id="card-equip" class="btn btn-equip">Equip ✓</button>
    </div>
    <div class="card-hint">Drag the card, or tap a button</div>
  </div>

  <!-- ================= GENERIC MODAL ================= -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal">
      <div id="modal-title" class="modal-title"></div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <!-- ================= TOASTS ================= -->
  <div id="toast-wrap" class="toast-wrap"></div>

  <!-- Scripts (classic, dependency-free, ordered) -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/hub.js"></script>
  <script src="js/missions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
