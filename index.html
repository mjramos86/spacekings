<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05060f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Space Kings — Endless Runner RPG</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
</head>
<body>
  <!-- Animated star background shared by all screens -->
  <div id="bg-stars" class="bg-stars" aria-hidden="true">
    <div class="star-layer layer1"></div>
    <div class="star-layer layer2"></div>
    <div class="star-layer layer3"></div>
    <div class="nebula"></div>
  </div>

  <div id="app" class="app">

    <!-- ====================== LOGIN ====================== -->
    <section id="screen-login" class="screen active">
      <div class="login-wrap">
        <div class="logo">
          <div class="logo-glyph">👑</div>
          <h1 class="logo-title">SPACE<span>KINGS</span></h1>
          <p class="logo-sub">Endless Runner • Auto-Combat RPG</p>
        </div>
        <div class="panel login-panel">
          <label class="field">
            <span>First name</span>
            <input id="login-first" type="text" autocomplete="off" maxlength="16" placeholder="e.g. Nova" />
          </label>
          <label class="field">
            <span>Last name</span>
            <input id="login-last" type="text" autocomplete="off" maxlength="16" placeholder="e.g. Vega" />
          </label>
          <button id="login-btn" class="btn btn-primary btn-block">Launch Captain</button>
          <p class="hint">Your progress is saved on this device, linked to your captain name.</p>
        </div>
        <div id="login-roster" class="roster"></div>
      </div>
    </section>

    <!-- ==================== APPEARANCE ==================== -->
    <section id="screen-appearance" class="screen">
      <div class="screen-head">
        <h2>Create Your Captain</h2>
      </div>
      <div class="appearance-wrap">
        <div class="avatar-stage">
          <div id="appearance-avatar" class="avatar-big"></div>
          <div id="appearance-name" class="avatar-name"></div>
        </div>
        <div class="panel appearance-controls">
          <div class="picker" data-group="sex">
            <span class="picker-label">Sex</span>
            <div class="picker-options" id="pick-sex"></div>
          </div>
          <div class="picker" data-group="skin">
            <span class="picker-label">Skin</span>
            <div class="picker-options swatches" id="pick-skin"></div>
          </div>
          <div class="picker" data-group="eyes">
            <span class="picker-label">Eyes</span>
            <div class="picker-options swatches" id="pick-eyes"></div>
          </div>
          <div class="picker" data-group="hair">
            <span class="picker-label">Hair</span>
            <div class="picker-options swatches" id="pick-hair"></div>
          </div>
          <button id="appearance-confirm" class="btn btn-primary btn-block">Confirm Captain</button>
        </div>
      </div>
    </section>

    <!-- ======================= HUB ======================= -->
    <section id="screen-hub" class="screen">
      <header class="topbar">
        <div id="hub-avatar" class="topbar-avatar"></div>
        <div class="topbar-info">
          <div class="topbar-name" id="hub-name">Captain</div>
          <div class="xpbar"><div class="xpbar-fill" id="hub-xpfill"></div><span class="xpbar-text" id="hub-xptext"></span></div>
        </div>
        <div class="topbar-right">
          <div class="credits" id="hub-credits">💰 0</div>
          <button id="hub-logout" class="btn btn-ghost btn-sm" title="Switch captain">⏻</button>
        </div>
      </header>

      <div class="hub-body station-body">
        <div class="station-caption">Welcome aboard, Captain — choose your destination</div>
        <div class="station-wrap">
          <svg class="station-svg" viewBox="0 0 1000 1160" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Station menu">
            <defs>
              <radialGradient id="st-sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd27a" stop-opacity=".45"/><stop offset="100%" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
              <radialGradient id="st-planet" cx="35%" cy="32%" r="80%"><stop offset="0" stop-color="#5fe0d2"/><stop offset="45%" stop-color="#2a7bd6"/><stop offset="100%" stop-color="#0c1838"/></radialGradient>
              <radialGradient id="st-reactor" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#d9fbff"/><stop offset="40%" stop-color="#37e6ff"/><stop offset="100%" stop-color="#0a3a5a"/></radialGradient>
              <linearGradient id="st-core" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#28335f"/><stop offset="1" stop-color="#141b3a"/></linearGradient>
              <linearGradient id="st-metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#33406f"/><stop offset="1" stop-color="#1a2348"/></linearGradient>
              <linearGradient id="st-panelg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1c2a58"/><stop offset="1" stop-color="#0e1838"/></linearGradient>
              <linearGradient id="st-flame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="35%" stop-color="#37e6ff"/><stop offset="100%" stop-color="#37e6ff" stop-opacity="0"/></linearGradient>
              <filter id="st-soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
            </defs>

            <!-- backdrop -->
            <circle cx="828" cy="170" r="150" fill="url(#st-sun)"/>
            <g>
              <circle cx="155" cy="980" r="175" fill="url(#st-planet)"/>
              <ellipse cx="155" cy="980" rx="300" ry="58" fill="none" stroke="#6fa8ff" stroke-width="4" opacity=".6" transform="rotate(-18 155 980)"/>
            </g>

            <!-- solar arrays -->
            <g class="st-panels" fill="url(#st-panelg)" stroke="#3a4a85" stroke-width="3">
              <rect x="408" y="300" width="74" height="175" rx="6"/><rect x="518" y="300" width="74" height="175" rx="6"/>
              <rect x="408" y="700" width="74" height="155" rx="6"/><rect x="518" y="700" width="74" height="155" rx="6"/>
            </g>
            <g stroke="#2b3a6a" stroke-width="2" opacity=".85">
              <line x1="408" y1="345" x2="482" y2="345"/><line x1="408" y1="388" x2="482" y2="388"/><line x1="408" y1="431" x2="482" y2="431"/><line x1="445" y1="300" x2="445" y2="475"/>
              <line x1="518" y1="345" x2="592" y2="345"/><line x1="518" y1="388" x2="592" y2="388"/><line x1="518" y1="431" x2="592" y2="431"/><line x1="555" y1="300" x2="555" y2="475"/>
              <line x1="408" y1="745" x2="482" y2="745"/><line x1="408" y1="795" x2="482" y2="795"/><line x1="445" y1="700" x2="445" y2="855"/>
              <line x1="518" y1="745" x2="592" y2="745"/><line x1="518" y1="795" x2="592" y2="795"/><line x1="555" y1="700" x2="555" y2="855"/>
            </g>

            <!-- structural spine + connector struts -->
            <g fill="url(#st-metal)" stroke="#3a4a85" stroke-width="2">
              <rect x="484" y="150" width="32" height="850" rx="8"/>
              <rect x="350" y="189" width="140" height="22" rx="6"/><rect x="510" y="189" width="140" height="22" rx="6"/>
              <rect x="345" y="564" width="58" height="22" rx="6"/><rect x="597" y="564" width="58" height="22" rx="6"/>
              <rect x="350" y="939" width="140" height="22" rx="6"/><rect x="510" y="939" width="140" height="22" rx="6"/>
            </g>

            <!-- rotating habitat ring -->
            <g class="hab-ring">
              <circle cx="500" cy="575" r="150" fill="none" stroke="#37e6ff" stroke-width="3" opacity=".3"/>
              <rect x="488" y="415" width="24" height="20" rx="5" fill="#2f3e72" stroke="#37e6ff" stroke-width="2"/>
              <rect x="358" y="640" width="24" height="20" rx="5" fill="#2f3e72" stroke="#37e6ff" stroke-width="2"/>
              <rect x="618" y="640" width="24" height="20" rx="5" fill="#2f3e72" stroke="#37e6ff" stroke-width="2"/>
            </g>

            <!-- reactor core -->
            <g>
              <circle cx="500" cy="575" r="112" fill="url(#st-core)" stroke="#3a4a85" stroke-width="4"/>
              <circle cx="500" cy="575" r="72" fill="#0e1838" stroke="#274a86" stroke-width="3"/>
              <circle class="reactor" cx="500" cy="575" r="46" fill="url(#st-reactor)" filter="url(#st-soft)"/>
              <circle cx="500" cy="575" r="40" fill="url(#st-reactor)"/>
              <g fill="#37e6ff" opacity=".5">
                <circle class="nav-light" cx="592" cy="575" r="7"/><circle class="nav-light" cx="546" cy="495" r="7"/><circle class="nav-light" cx="454" cy="495" r="7"/>
                <circle class="nav-light" cx="408" cy="575" r="7"/><circle class="nav-light" cx="454" cy="655" r="7"/><circle class="nav-light" cx="546" cy="655" r="7"/>
              </g>
            </g>

            <!-- command bridge (decorative) -->
            <g>
              <line x1="500" y1="118" x2="500" y2="80" stroke="#3a4a85" stroke-width="4"/>
              <circle class="nav-light" cx="500" cy="76" r="6" fill="#ff5d6c"/>
              <rect x="455" y="116" width="90" height="64" rx="20" fill="url(#st-metal)" stroke="#3a4a85" stroke-width="3"/>
              <rect x="471" y="132" width="58" height="22" rx="9" fill="#0a1228" stroke="#37e6ff" stroke-width="2"/>
              <text class="st-tag" x="500" y="104">COMMAND</text>
            </g>

            <!-- engines (decorative) -->
            <g>
              <rect x="440" y="984" width="120" height="40" rx="10" fill="url(#st-metal)" stroke="#3a4a85" stroke-width="3"/>
              <rect x="455" y="1020" width="28" height="44" rx="6" fill="#1a2348" stroke="#3a4a85" stroke-width="2"/>
              <rect x="517" y="1020" width="28" height="44" rx="6" fill="#1a2348" stroke="#3a4a85" stroke-width="2"/>
              <polygon class="st-flame" points="455,1063 483,1063 469,1130" fill="url(#st-flame)"/>
              <polygon class="st-flame" points="517,1063 545,1063 531,1130" fill="url(#st-flame)"/>
            </g>

            <!-- drifting satellite -->
            <g class="st-drift">
              <rect x="876" y="62" width="14" height="12" fill="url(#st-panelg)" stroke="#3a4a85" stroke-width="2"/>
              <rect x="930" y="62" width="14" height="12" fill="url(#st-panelg)" stroke="#3a4a85" stroke-width="2"/>
              <rect x="892" y="58" width="36" height="20" rx="4" fill="url(#st-metal)" stroke="#3a4a85" stroke-width="2"/>
            </g>

            <!-- ===== MODULE PODS (clickable) ===== -->
            <g class="station-pod pod-mission" style="color:#46e08a" data-action="mission-planet" tabindex="0" role="button" aria-label="Planet Exploration">
              <rect class="pod-body" x="50" y="110" width="300" height="180" rx="24"/>
              <rect class="pod-screen" x="72" y="130" width="256" height="84" rx="12"/>
              <text class="pod-icon" x="200" y="172">🪐</text>
              <text class="pod-label" x="200" y="250">Planet</text>
              <text class="pod-sub" x="200" y="278">Exploration</text>
              <circle class="nav-light" cx="66" cy="126" r="5" fill="currentColor"/><circle class="nav-light" cx="334" cy="126" r="5" fill="currentColor"/>
            </g>
            <g class="station-pod pod-mission" style="color:#b46bff" data-action="mission-ship" tabindex="0" role="button" aria-label="Ship Battle">
              <rect class="pod-body" x="650" y="110" width="300" height="180" rx="24"/>
              <rect class="pod-screen" x="672" y="130" width="256" height="84" rx="12"/>
              <text class="pod-icon" x="800" y="172">🛸</text>
              <text class="pod-label" x="800" y="250">Ship</text>
              <text class="pod-sub" x="800" y="278">Battle</text>
              <circle class="nav-light" cx="666" cy="126" r="5" fill="currentColor"/><circle class="nav-light" cx="934" cy="126" r="5" fill="currentColor"/>
            </g>
            <g class="station-pod" style="color:#37e6ff" data-action="character" tabindex="0" role="button" aria-label="Captain">
              <rect class="pod-body" x="50" y="485" width="300" height="180" rx="24"/>
              <rect class="pod-screen" x="72" y="505" width="256" height="84" rx="12"/>
              <text class="pod-icon" x="200" y="547">🧑‍🚀</text>
              <text class="pod-label" x="200" y="625">Captain</text>
              <text class="pod-sub" x="200" y="653">Stats &amp; gear</text>
              <circle class="nav-light" cx="66" cy="501" r="5" fill="currentColor"/><circle class="nav-light" cx="334" cy="501" r="5" fill="currentColor"/>
            </g>
            <g class="station-pod" style="color:#5ad1ff" data-action="ship" tabindex="0" role="button" aria-label="Ship Bay">
              <rect class="pod-body" x="650" y="485" width="300" height="180" rx="24"/>
              <rect class="pod-screen" x="672" y="505" width="256" height="84" rx="12"/>
              <text class="pod-icon" x="800" y="547">🚀</text>
              <text class="pod-label" x="800" y="625">Ship Bay</text>
              <text class="pod-sub" x="800" y="653">Upgrade ship</text>
              <circle class="nav-light" cx="666" cy="501" r="5" fill="currentColor"/><circle class="nav-light" cx="934" cy="501" r="5" fill="currentColor"/>
            </g>
            <g class="station-pod" style="color:#ffb24b" data-action="robots" tabindex="0" role="button" aria-label="Robotics">
              <rect class="pod-body" x="50" y="860" width="300" height="180" rx="24"/>
              <rect class="pod-screen" x="72" y="880" width="256" height="84" rx="12"/>
              <text class="pod-icon" x="200" y="922">🤖</text>
              <text class="pod-label" x="200" y="1000">Robotics</text>
              <text class="pod-sub" x="200" y="1028">Robot team</text>
              <circle class="nav-light" cx="66" cy="876" r="5" fill="currentColor"/><circle class="nav-light" cx="334" cy="876" r="5" fill="currentColor"/>
            </g>
            <g class="station-pod" style="color:#ffd54a" data-action="shop" tabindex="0" role="button" aria-label="Shop">
              <rect class="pod-body" x="650" y="860" width="300" height="180" rx="24"/>
              <rect class="pod-screen" x="672" y="880" width="256" height="84" rx="12"/>
              <text class="pod-icon" x="800" y="922">🛒</text>
              <text class="pod-label" x="800" y="1000">Shop</text>
              <text class="pod-sub" x="800" y="1028">Buy &amp; sell</text>
              <circle class="nav-light" cx="666" cy="876" r="5" fill="currentColor"/><circle class="nav-light" cx="934" cy="876" r="5" fill="currentColor"/>
            </g>
          </svg>
        </div>
      </div>
    </section>

    <!-- ================= GENERIC PANEL SCREEN ================= -->
    <section id="screen-panel" class="screen">
      <header class="screen-head sub">
        <button class="btn btn-ghost btn-sm back-btn" data-back>‹ Station</button>
        <h2 id="panel-title">Panel</h2>
        <div class="head-spacer"></div>
      </header>
      <div id="panel-content" class="panel-content"></div>
    </section>

    <!-- ================= MISSION SELECT ================= -->
    <section id="screen-select" class="screen">
      <header class="screen-head sub">
        <button class="btn btn-ghost btn-sm back-btn" data-back-hub>‹ Hub</button>
        <h2 id="select-title">Choose a Target</h2>
        <div class="head-spacer"></div>
      </header>
      <div id="select-content" class="select-content"></div>
    </section>

    <!-- ================= RUN / COMBAT ================= -->
    <section id="screen-run" class="screen run-screen">
      <div id="run-scene" class="run-scene">
        <div class="run-stars" aria-hidden="true">
          <div class="rs-neb"></div>
          <div class="rs-layer rs1"></div>
          <div class="rs-layer rs2"></div>
          <div class="rs-layer rs3"></div>
        </div>

        <!-- planet surface environment (planet exploration) -->
        <div class="planet-scene" aria-hidden="true">
          <svg class="planet-bg" viewBox="0 0 1000 1100" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="ps-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070a20"/><stop offset="40%" stop-color="#0e1740"/><stop offset="70%" stop-color="#1b2a63"/><stop offset="100%" stop-color="#27619a"/></linearGradient>
              <linearGradient id="ps-ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c5a44"/><stop offset="55%" stop-color="#123a30"/><stop offset="100%" stop-color="#0b211c"/></linearGradient>
              <linearGradient id="ps-path" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fe9ff"/><stop offset="100%" stop-color="#2a6f9e"/></linearGradient>
              <linearGradient id="ps-ufo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff5db0"/><stop offset="35%" stop-color="#ffd54a"/><stop offset="65%" stop-color="#46e08a"/><stop offset="100%" stop-color="#37a8ff"/></linearGradient>
              <radialGradient id="ps-ufoGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#bff7ff" stop-opacity=".9"/><stop offset="100%" stop-color="#bff7ff" stop-opacity="0"/></radialGradient>
              <radialGradient id="ps-mush" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#c79bf2"/><stop offset="60%" stop-color="#8a4fd0"/><stop offset="100%" stop-color="#5a2f9a"/></radialGradient>
              <radialGradient id="ps-mushGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#b06bff" stop-opacity=".8"/><stop offset="100%" stop-color="#b06bff" stop-opacity="0"/></radialGradient>
              <radialGradient id="ps-horizon" cx="50%" cy="100%" r="60%"><stop offset="0" stop-color="#46c9e0" stop-opacity=".55"/><stop offset="100%" stop-color="#46c9e0" stop-opacity="0"/></radialGradient>
            </defs>
            <rect width="1000" height="560" fill="url(#ps-sky)"/>
            <ellipse cx="500" cy="500" rx="600" ry="120" fill="url(#ps-horizon)"/>
            <g fill="#fff">
              <circle cx="120" cy="70" r="2.5"/><circle cx="240" cy="140" r="1.6"/><circle cx="360" cy="60" r="2"/><circle cx="520" cy="110" r="1.5"/>
              <circle cx="180" cy="220" r="1.8"/><circle cx="300" cy="280" r="1.4"/><circle cx="60" cy="320" r="1.6"/><circle cx="640" cy="80" r="1.7"/>
              <circle cx="880" cy="300" r="2"/><circle cx="820" cy="150" r="1.5"/><circle cx="940" cy="90" r="1.8"/><circle cx="440" cy="200" r="1.4"/>
              <circle cx="700" cy="250" r="1.5"/><circle cx="980" cy="220" r="1.6"/><circle cx="40" cy="140" r="1.5"/>
            </g>
            <g class="ps-ufo">
              <ellipse cx="760" cy="180" rx="170" ry="90" fill="url(#ps-ufoGlow)"/>
              <ellipse cx="760" cy="190" rx="130" ry="30" fill="url(#ps-ufo)" stroke="#bff7ff" stroke-width="3"/>
              <ellipse cx="760" cy="172" rx="62" ry="34" fill="#0e2036" stroke="#9fe9ff" stroke-width="3"/>
              <ellipse cx="760" cy="166" rx="46" ry="20" fill="#37a8ff" opacity=".7"/>
              <ellipse cx="760" cy="205" rx="150" ry="12" fill="url(#ps-ufo)" opacity=".5"/>
            </g>
            <polygon points="-20,520 120,330 240,440 360,300 470,440 560,360 700,470 850,330 1020,500 1020,560 -20,560" fill="#26365f"/>
            <polygon points="360,300 410,355 330,355" fill="#cfe0ff"/><polygon points="240,330 285,378 200,378" fill="#cfe0ff" opacity=".85"/>
            <polygon points="850,330 895,382 805,382" fill="#cfe0ff" opacity=".9"/>
            <polygon points="-20,560 200,470 420,560 -20,560" fill="#1c2a4d" opacity=".7"/>
            <polygon points="1020,560 760,470 560,560 1020,560" fill="#1c2a4d" opacity=".7"/>
            <rect y="520" width="1000" height="580" fill="url(#ps-ground)"/>
            <polygon points="468,520 532,520 760,1100 240,1100" fill="url(#ps-path)" opacity=".92"/>
            <polygon points="468,520 532,520 760,1100 240,1100" fill="none" stroke="#aef6ff" stroke-width="4" opacity=".8"/>
            <g stroke="#0f3550" stroke-width="3" opacity=".55" fill="none">
              <path d="M470,560 L530,560"/><path d="M458,620 L542,620"/><path d="M442,700 L558,700"/><path d="M420,800 L580,800"/><path d="M392,920 L608,920"/><path d="M360,1060 L640,1060"/>
            </g>
            <path d="M500,520 L500,1100" stroke="#dffaff" stroke-width="2" opacity=".5" fill="none"/>
            <g class="ps-flora">
              <path d="M120,1000 q-30,-120 10,-220" stroke="#3aa66a" stroke-width="10" fill="none" stroke-linecap="round"/>
              <path d="M150,1000 q10,-140 -30,-240" stroke="#2f8f5a" stroke-width="8" fill="none" stroke-linecap="round"/>
              <ellipse cx="120" cy="690" rx="130" ry="130" fill="url(#ps-mushGlow)"/>
              <rect x="104" y="690" width="26" height="120" rx="12" fill="#d8c7e8"/>
              <ellipse cx="117" cy="690" rx="86" ry="46" fill="url(#ps-mush)"/>
              <circle cx="95" cy="678" r="9" fill="#ecdcff"/><circle cx="140" cy="690" r="7" fill="#ecdcff"/><circle cx="118" cy="668" r="6" fill="#ecdcff"/>
            </g>
            <g class="ps-flora">
              <ellipse cx="70" cy="900" rx="90" ry="90" fill="url(#ps-mushGlow)"/>
              <rect x="58" y="900" width="22" height="100" rx="10" fill="#d8c7e8"/>
              <ellipse cx="69" cy="900" rx="64" ry="34" fill="url(#ps-mush)"/>
              <circle cx="50" cy="892" r="7" fill="#ecdcff"/><circle cx="86" cy="902" r="6" fill="#ecdcff"/>
            </g>
            <g class="ps-flora">
              <path d="M900,1010 q40,-130 -6,-240" stroke="#7a3ac1" stroke-width="10" fill="none" stroke-linecap="round"/>
              <path d="M928,1010 q20,-150 -40,-250" stroke="#9a4fd0" stroke-width="7" fill="none" stroke-linecap="round"/>
              <ellipse cx="905" cy="700" rx="135" ry="135" fill="url(#ps-mushGlow)"/>
              <rect x="892" y="700" width="26" height="120" rx="12" fill="#d8c7e8"/>
              <ellipse cx="905" cy="700" rx="90" ry="48" fill="url(#ps-mush)"/>
              <circle cx="880" cy="688" r="9" fill="#ecdcff"/><circle cx="928" cy="700" r="7" fill="#ecdcff"/><circle cx="906" cy="678" r="6" fill="#ecdcff"/>

              <ellipse cx="950" cy="910" rx="95" ry="95" fill="url(#ps-mushGlow)"/>

        <div class="corridor-scene" aria-hidden="true"></div>

        <div class="run-ceiling"></div>

        <div id="run-travel" class="run-travel">
          <div class="travel-text">RUNNING…</div>
        </div>

        <!-- combat view injected here -->
        <div id="combat-view" class="combat-view"></div>

        <div id="fp-gun" class="fp-gun" aria-hidden="true"></div>

  </div>

  <!-- ================= LOOT CARD OVERLAY ================= -->
  <div id="card-overlay" class="card-overlay">
    <div class="card-zones">
      <div class="card-zone left"><span>⬅ SELL</span></div>
      <div class="card-zone right"><span>EQUIP ➡</span></div>
    </div>
    <div id="loot-card" class="loot-card">
      <div class="loot-rarity-bar"></div>
      <div class="loot-head">
        <div class="loot-icon"></div>
        <div class="loot-name"></div>
        <div class="loot-rarity"></div>
      </div>
      <div class="loot-stats"></div>
      <div class="loot-foot">
        <div class="loot-slot"></div>
        <div class="loot-value"></div>
      </div>
    </div>
    <div class="card-actions">
      <button id="card-sell" class="btn btn-sell">Sell 💰</button>
      <button id="card-equip" class="btn btn-equip">Equip ✓</button>
    </div>
    <div class="card-hint">Drag the card, or tap a button</div>
  </div>

  <!-- ================= GENERIC MODAL ================= -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal">
      <div id="modal-title" class="modal-title"></div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <!-- ================= TOASTS ================= -->
  <div id="toast-wrap" class="toast-wrap"></div>

  <script src="js/ui.js"></script>
  <script src="js/cards.js"></script>
